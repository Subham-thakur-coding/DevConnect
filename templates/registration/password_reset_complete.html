{% extends "community/auth/base.html" %}

{% block title %}Password Updated | DevConnect{% endblock %}

{% block auth_content %}
<section class="auth-card text-center">

    <div class="auth-icon">
        <i class="bi bi-check-circle"></i>
    </div>

    <h1>Password Updated!</h1>

    <p class="auth-subtitle">
        Your DevConnect account password has been changed successfully.
    </p>

    <a href="{% url 'auth:login' %}" class="btn auth-button">
        Sign In Now
        <i class="bi bi-arrow-right"></i>
    </a>

    <div class="security-note mt-4">
        <i class="bi bi-shield-check"></i>
        Your account is protected with your new password.
    </div>

</section>
{% endblock %}
