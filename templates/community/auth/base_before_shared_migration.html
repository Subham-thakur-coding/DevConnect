{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}DevConnect{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --text: #1e1b4b;
            --muted: #77758d;
            --surface: #ffffff;
            --page: #f5f5ff;
            --border: #e8e7f4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            color: var(--text);
            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(139, 92, 246, 0.13),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(99, 102, 241, 0.12),
                    transparent 30%
                ),
                var(--page);
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
        }

        .auth-navbar {
            padding: 20px 0;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            color: var(--text);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-icon {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            color: white;
            border-radius: 14px;
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--secondary)
            );
            box-shadow: 0 8px 22px rgba(99, 102, 241, 0.25);
        }

        .brand span span {
            color: var(--primary);
        }

        .auth-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px 55px;
        }

        .auth-card {
            width: 100%;
            max-width: 470px;
            padding: 38px;
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 26px;
            background: var(--surface);
            box-shadow: 0 24px 70px rgba(40, 30, 100, 0.09);
            animation: appear 0.45s ease both;
        }

        .auth-icon {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            margin-bottom: 23px;
            color: white;
            font-size: 1.5rem;
            border-radius: 19px;
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--secondary)
            );
        }

        .auth-card h1 {
            margin-bottom: 9px;
            font-size: clamp(1.65rem, 4vw, 2rem);
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .auth-subtitle {
            margin-bottom: 27px;
            color: var(--muted);
            line-height: 1.65;
        }

        .form-label {
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 650;
        }

        .form-control {
            min-height: 49px;
            padding: 12px 14px;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .field-group {
            margin-bottom: 19px;
        }

        .auth-button {
            width: 100%;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-top: 9px;
            color: white;
            font-weight: 700;
            border: 0;
            border-radius: 13px;
            background: linear-gradient(
                110deg,
                var(--primary),
                var(--secondary)
            );
            box-shadow: 0 9px 22px rgba(99, 102, 241, 0.22);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-button:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 13px 27px rgba(99, 102, 241, 0.3);
        }

        .auth-switch {
            margin: 25px 0 0;
            color: var(--muted);
            text-align: center;
            font-size: 0.93rem;
        }

        .auth-switch a {
            color: var(--primary);
            font-weight: 750;
            text-decoration: none;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        .errorlist {
            margin: 8px 0 0;
            padding: 0;
            color: #dc3545;
            list-style: none;
            font-size: 0.85rem;
        }

        .error-box {
            padding: 12px 14px;
            margin-bottom: 20px;
            color: #b42332;
            background: #fff0f1;
            border: 1px solid #ffd6da;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .auth-footer {
            padding: 0 15px 24px;
            color: var(--muted);
            text-align: center;
            font-size: 0.82rem;
        }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 22px;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .security-note i {
            color: #16a34a;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 27px 21px;
                border-radius: 21px;
            }

            .auth-navbar {
                padding: 15px 0;
            }

            .brand {
                font-size: 1.08rem;
            }

            .auth-main {
                padding-top: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <header class="auth-navbar">
        <div class="container">
            <a href="/" class="brand">
                <span class="brand-icon">
                    <i class="bi bi-code-slash"></i>
                </span>

                <span>
                    DevConnect
                </span>
            </a>
        </div>
    </header>

    <main class="auth-main">
        {% block auth_content %}{% endblock %}
    </main>

    <footer class="auth-footer">
        &copy; {% now "Y" %}DevConnect.
        Built for developers, by NetVibe. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
